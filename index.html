<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>334 Expression Solver</title>

<style>

:root{
 --accent:#1a73e8;
 --bg:#f3f8ff;
 --card:#ffffff;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:var(--bg);
 font-family:"Segoe UI",sans-serif;
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
}

.container{
 width:min(1000px,95vw);

 background:var(--card);

 border-radius:16px;

 padding:30px;

 box-shadow:
 0 10px 30px
 rgba(0,0,0,.15);
}

h1{
 margin-top:0;
 color:var(--accent);
}

.controls{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
}

input{
 font-size:18px;
 padding:10px;
}

button{
 border:none;
 border-radius:8px;

 background:var(--accent);
 color:white;

 padding:
 10px
 20px;

 cursor:pointer;
}

button:hover{
 filter:brightness(.95);
}

.result{
 margin-top:20px;

 background:#eef5ff;

 border-left:
 5px solid
 var(--accent);

 padding:16px;

 border-radius:10px;
}

#value{
 font-size:34px;
 font-weight:bold;
 color:var(--accent);
}

#expr{
 margin-top:10px;
 font-size:24px;
 word-break:break-all;
}

#meta{
 margin-top:10px;
 color:#666;
}

</style>
</head>
<body>

<div class="container">

<h1>334 Expression Solver</h1>

<div class="controls">

<input
 id="target"
 type="number"
 min="0"
 placeholder="自然数">

<input
 id="bags"
 type="number"
 value="1"
 min="1"
 max="4">

<button onclick="runSearch()">
検索
</button>

</div>

<div class="result">

<div id="status">
待機中
</div>

<div id="value">
-
</div>

<div id="expr">
式はここに表示されます
</div>

<div id="meta">
-
</div>

</div>

</div>

<script>

const EPS = 1e-9;

const MAX_ABS_VALUE =
1000000;

const MAX_STATES_PER_INTERVAL =
800;

class Expr{

 constructor(
  value,
  text,
  cost
 ){

  this.value =
  value;

  this.text =
  text;

  this.cost =
  cost;

 }

}

const SUPER = {

 "0":"⁰",
 "1":"¹",
 "2":"²",
 "3":"³",
 "4":"⁴",
 "5":"⁵",
 "6":"⁶",
 "7":"⁷",
 "8":"⁸",
 "9":"⁹",

 "-":"⁻"

};

const SUB = {

 "0":"₀",
 "1":"₁",
 "2":"₂",
 "3":"₃",
 "4":"₄",
 "5":"₅",
 "6":"₆",
 "7":"₇",
 "8":"₈",
 "9":"₉",

 "-":"₋"

};

function superscript(n){

 return String(n)
 .split("")
 .map(
  x =>
  SUPER[x] || x
 )
 .join("");

}

function subscript(n){

 return String(n)
 .split("")
 .map(
  x =>
  SUB[x] || x
 )
 .join("");

}

function normalize(v){

 if(
  !Number.isFinite(v)
 ){
  return null;
 }

 if(
  Math.abs(v)
  >
  MAX_ABS_VALUE
 ){
  return null;
 }

 return Math.round(
  v * 1e8
 ) / 1e8;

}

function key(v){

 return String(
  normalize(v)
 );

}

function factorial(n){

 if(
  !Number.isInteger(n)
 ){
  return null;
 }

 if(
  n < 0 ||
  n > 8
 ){
  return null;
 }

 let r = 1;

 for(
  let i=2;
  i<=n;
  i++
 ){

  r *= i;

 }

 return r;

}

function wrap(s){

 if(
  /^[0-9]+$/.test(s)
 ){
  return s;
 }

 return "(" + s + ")";

}

function createDigits(
 bagCount
){

 const arr = [];

 for(
  let i=0;
  i<bagCount;
  i++
 ){

  arr.push("3");
  arr.push("3");
  arr.push("4");

 }

 return arr;

}

function store(map,e){

 const k = key(e.value);

 if(k==="null"){
  return;
 }

 if(
  !map.has(k)
  ||
  map.get(k).cost > e.cost
 ){

  map.set(k,e);

 }

 if(
  map.size >
  MAX_STATES_PER_INTERVAL
 ){

  const best =
   [...map.values()]
   .sort(
    (a,b)=>
    a.cost-b.cost
   )
   .slice(
    0,
    MAX_STATES_PER_INTERVAL
   );

  map.clear();

  for(
   const v
   of best
  ){

   map.set(
    key(v.value),
    v
   );

  }

 }

}

// ------------------
// 単項演算
// ------------------

function unary(
 expr,
 map
){

 const f =
  factorial(
   expr.value
  );

 if(f!==null){

  store(
   map,
   new Expr(
    f,
    `(${expr.text})!`,
    expr.cost+1
   )
  );

 }

 // √

 if(expr.value>=0){

  store(
   map,
   new Expr(
    Math.sqrt(
     expr.value
    ),
    `√(${expr.text})`,
    expr.cost+1
   )
  );

 }

 // floor

 store(
  map,
  new Expr(
   Math.floor(
    expr.value
   ),
   `⌊${expr.text}⌋`,
   expr.cost+1
  )
 );

 // ceil

 store(
  map,
  new Expr(
   Math.ceil(
    expr.value
   ),
   `⌈${expr.text}⌉`,
   expr.cost+1
  )
 );

 // ガウス

 store(
  map,
  new Expr(
   Math.floor(
    expr.value
   ),
   `[${expr.text}]`,
   expr.cost+1
  )
 );

 // sin

 {
  const v =
   Math.sin(
    expr.value
   );

  store(
   map,
   new Expr(
    v,
    `sin(${expr.text})`,
    expr.cost+1
   )
  );
 }

 // cos

 {
  const v =
   Math.cos(
    expr.value
   );

  store(
   map,
   new Expr(
    v,
    `cos(${expr.text})`,
    expr.cost+1
   )
  );
 }

 // tan

 {
  const v =
   Math.tan(
    expr.value
   );

  if(
   Number.isFinite(v)
  ){

   store(
    map,
    new Expr(
     v,
     `tan(${expr.text})`,
     expr.cost+1
    )
   );

  }

 }

 // sec

 {
  const c =
   Math.cos(
    expr.value
   );

  if(
   Math.abs(c)
   > EPS
  ){

   store(
    map,
    new Expr(
     1/c,
     `sec(${expr.text})`,
     expr.cost+1
    )
   );

  }

 }

 // csc

 {
  const s =
   Math.sin(
    expr.value
   );

  if(
   Math.abs(s)
   > EPS
  ){

   store(
    map,
    new Expr(
     1/s,
     `csc(${expr.text})`,
     expr.cost+1
    )
   );

  }

 }

 // cot

 {
  const t =
   Math.tan(
    expr.value
   );

  if(
   Math.abs(t)
   > EPS
  ){

   store(
    map,
    new Expr(
     1/t,
     `cot(${expr.text})`,
     expr.cost+1
    )
   );

  }

 }

}

// ------------------
// 二項演算
// ------------------

function binary(
 A,
 B,
 map
){

 store(
  map,
  new Expr(
   A.value+B.value,
   `(${A.text}+${B.text})`,
   A.cost+B.cost+1
  )
 );

 store(
  map,
  new Expr(
   A.value-B.value,
   `(${A.text}-${B.text})`,
   A.cost+B.cost+1
  )
 );

 store(
  map,
  new Expr(
   A.value*B.value,
   `(${A.text}×${B.text})`,
   A.cost+B.cost+1
  )
 );

 if(
  Math.abs(B.value)
  > EPS
 ){

  store(
   map,
   new Expr(
    A.value/B.value,
    `(${A.text}÷${B.text})`,
    A.cost+B.cost+1
   )
  );

  store(
   map,
   new Expr(
    A.value%B.value,
    `(${A.text}%${B.text})`,
    A.cost+B.cost+1
   )
  );

 }

 // 累乗

 if(
  Number.isInteger(
   B.value
  )
  &&
  Math.abs(
   B.value
  ) <= 6
 ){

  store(
   map,
   new Expr(
    A.value**
    B.value,
    `${wrap(A.text)}${superscript(B.value)}`,
    A.cost+
    B.cost+1
   )
  );

 }

 // n乗根

 if(
  Number.isInteger(
   A.value
  )
  &&
  A.value > 1
  &&
  B.value >= 0
 ){

  store(
   map,
   new Expr(
    Math.pow(
     B.value,
     1/A.value
    ),
    `${subscript(A.value)}√(${B.text})`,
    A.cost+
    B.cost+1
   )
  );

 }

 // 対数

 if(
  A.value > 0
  &&
  B.value > 0
  &&
  Math.abs(
   A.value-1
  ) > EPS
 ){

  store(
   map,
   new Expr(
    Math.log(
     B.value
    )
    /
    Math.log(
     A.value
    ),
    `log${subscript(A.text)}(${B.text})`,
    A.cost+
    B.cost+1
   )
  );

 }

}
// ------------------
// メイン探索
// ------------------

function solve334(
 target,
 digits
){

 const N =
  digits.length;

 const dp =
  Array.from(
   {length:N},
   ()=>Array(N)
  );

 // 単体

 for(
  let i=0;
  i<N;
  i++
 ){

  dp[i][i] =
   new Map();

  store(
   dp[i][i],
   new Expr(
    Number(
     digits[i]
    ),
    digits[i],
    0
   )
  );

 }

 // 連結

 for(
  let len=2;
  len<=N;
  len++
 ){

  for(
   let l=0;
   l+len-1<N;
   l++
  ){

   const r =
    l+len-1;

   if(
    !dp[l][r]
   ){

    dp[l][r] =
     new Map();

   }

   const concat =
    digits
    .slice(
     l,
     r+1
    )
    .join("");

   store(
    dp[l][r],
    new Expr(
     Number(concat),
     concat,
     0
    )
   );

  }

 }

 // 区間DP

 for(
  let len=2;
  len<=N;
  len++
 ){

  for(
   let l=0;
   l+len-1<N;
   l++
  ){

   const r =
    l+len-1;

   if(
    !dp[l][r]
   ){

    dp[l][r] =
     new Map();

   }

   for(
    let mid=l;
    mid<r;
    mid++
   ){

    const left =
     dp[l][mid];

    const right =
     dp[mid+1][r];

    for(
     const A
     of left.values()
    ){

     for(
      const B
      of right.values()
     ){

      binary(
       A,
       B,
       dp[l][r]
      );

     }

    }

   }

   const snapshot =
    [
     ...dp[l][r]
     .values()
    ];

   for(
    const e
    of snapshot
   ){

    unary(
     e,
     dp[l][r]
    );

   }

  }

 }

 const root =
  dp[0][N-1];

 const answers =
  [];

 for(
  const e
  of root.values()
 ){

  if(
   Math.abs(
    e.value-target
   ) < EPS
  ){

   answers.push(e);

  }

 }

 answers.sort(
  (a,b)=>{

   if(
    a.cost !==
    b.cost
   ){

    return (
     a.cost
     -
     b.cost
    );

   }

   return (
    a.text.length
    -
    b.text.length
   );

  }
 );

 if(
  answers.length
 )
 {

  return answers[0];

 }

 return null;

}

// ------------------
// UI
// ------------------

function runSearch(){

 const target =
  Number(
   document
   .getElementById(
    "target"
   )
   .value
  );

 const bags =
  Number(
   document
   .getElementById(
    "bags"
   )
   .value
  );

 if(
  !Number.isInteger(
   target
  )
  ||
  target < 0
 ){

  document
  .getElementById(
   "status"
  )
  .textContent =
  "エラー";

  document
  .getElementById(
   "expr"
  )
  .textContent =
  "自然数を入力してください";

  return;

 }

 document
 .getElementById(
  "status"
 )
 .textContent =
 "探索中...";

 setTimeout(()=>{

  const digits =
   createDigits(
    bags
   );

  const answer =
   solve334(
    target,
    digits
   );

  if(answer){

   document
   .getElementById(
    "status"
   )
   .textContent =
   "発見";

   document
   .getElementById(
    "value"
   )
   .textContent =
   target;

   document
   .getElementById(
    "expr"
   )
   .textContent =
   answer.text;

   let meta =
    `Bag数:${bags} `
    +
    `Cost:${answer.cost}`;

   if(
    answer.text
    ===
    "33%4"
   ){

    meta +=
    " 🐯 33-4";

   }

   document
   .getElementById(
    "meta"
   )
   .textContent =
   meta;

  }else{

   document
   .getElementById(
    "status"
   )
   .textContent =
   "未発見";

   document
   .getElementById(
    "expr"
   )
   .textContent =
   "探索範囲内では見つかりませんでした";

  }

 },10);

}

</script>

</body>
</html>
