<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>334 Expression Solver</title>

<style>
:root{
    --accent:#1a73e8;

}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:var(--bg);

}

}

.desc{

}

.controls{

    gap:10px;
    flex-wrap:wrap;
}

input{
    flex:1;

}

button{
    border:none;

    font-size:18px;
}

button:hover{
    background:#165dc0;
}

.options{
    margin-top:16px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.card{
    margin-top:24px;
    background:#eef5ff;
    border-left:5px solid var(--accent);
    padding:16px;

}

.value{
    font-size:32px;

}

.expr{
    font-size:24px;
    margin-top:10px;
    word-break:break-word;
}

    margin-top:10px;

}

.loading{
    color:#ff9800;
}

    color:#c62828;
}

    color:#2e7d32;
}
</style>
</head>
<body>

<div class="container">

<h1>334 Expression Solver</h1>

<div class="desc">
3,3,4 を順番通り使用して自然数を表現します。
n-Bag対応。
</div>

<div class="controls">

<input
id="target"
type="number"
min="0"
placeholder="自然数を入力">

<input
id="bags"
type="number"
min="1"
max="5"
value="1">

<button onclick="runSearch()">
検索
</button>

</div>

<div class="options">

<label>
<input type="checkbox"
id="allowConcat"
checked>
連結(33,334)
</label>

<label>
<input type="checkbox"
id="allowFactorial"
checked>
階乗
</label>

<label>
<input type="checkbox"
id="allowPower"
checked>
累乗
</label>

</div>

<div class="card">

<div id="status">
待機中
</div>

<div class="value" id="value">
-
</div>

<div class="expr" id="expr">
式はここに表示されます
</div>

<div class="meta" id="meta">
-
</div>

</div>

</div>

<script>

// ======================================
// Unicode上付き文字
// ======================================

const SUPER = {
    "0":"⁰",
    "1":"¹",
    "2":"²",
    "3":"³",
    "4":"⁴",
    "5":"⁵",
    "6":"⁶",
    "7":"⁷",
    "8":"⁸",
    "9":"⁹",
    "-":"⁻"
};

function superscript(n){

    return String(n)
        .split("")
        .map(c=>SUPER[c]||c)
        .join("");
}
const SUB = {
    "0":"₀",
    "1":"₁",
    "2":"₂",
    "3":"₃",
    "4":"₄",
    "5":"₅",
    "6":"₆",
    "7":"₇",
    "8":"₈",
    "9":"₉",
    "-":"₋"
};

function subscript(n){

    return String(n)
        .split("")
        .map(
            c => SUB[c] || c
        )
        .join("");

}


// ======================================
// HTML表示
// ======================================

function showResult(value,expr,info){

    document.getElementById("value")
        .textContent = value;

    document.getElementById("expr")
        .textContent = expr;

    document.getElementById("meta")
        .textContent = info;

    document.getElementById("status")
        .innerHTML =
        '<span class="success">発見</span>';
}

function showError(msg){

    document.getElementById("status")
        .innerHTML =
        '<span class="error">エラー</span>';

    document.getElementById("expr")
        .textContent = msg;
}

function showLoading(){

    document.getElementById("status")
        .innerHTML =
        '<span class="loading">探索中...</span>';

    document.getElementById("expr")
        .textContent =
        "式を探索しています...";
}

// ======================================
// Bag生成
// ======================================

function createDigits(bagCount){

    const arr = [];

    for(let i=0;i<bagCount;i++){

        arr.push("3");
        arr.push("3");
        arr.push("4");

    }

    return arr;
}

// ======================================
// 検索開始
// ======================================

function runSearch(){

    const target =
        Number(
            document.getElementById("target").value
        );

    const bags =
        Number(
            document.getElementById("bags").value
        );

    if(!Number.isInteger(target) || target < 0){

        showError(
            "自然数を入力してください"
        );

        return;
    }

    showLoading();

    const digits =
        createDigits(bags);

    setTimeout(()=>{

        // Part2で実装
        const answers =
            solve334(
                target,
                digits
            );

        if(answer){

            showResult(
                answer.value,
                answer.expr,
                `Bag数: ${bags}`
            );

        }else{

            showError(
                "探索範囲内では見つかりませんでした"
            );
        }

    },10);
}

// ======================================
// Part2で実装する本体
// ======================================
// ======================================
// Part2
// ======================================

class Expr {

    constructor(value,text,cost){

        this.value = value;
        this.text = text;
        this.cost = cost;

    }

}

const EPS = 1e-9;

const MAX_STATES_PER_INTERVAL = 1000;
const MAX_ABS_VALUE = 1000000;

// ----------------------------

function factorial(n){

    if(
        !Number.isInteger(n) ||
        n < 0 ||
        n > 8
    ){
        return null;
    }

    let r = 1;

    for(let i=2;i<=n;i++){

        r *= i;

    }

    return r;

}

// ----------------------------

function normalize(v){

    if(!Number.isFinite(v))
        return null;

    if(Math.abs(v) > MAX_ABS_VALUE)
        return null;

    return Math.round(v*1e8)/1e8;

}

// ----------------------------

function key(v){

    return String(
        normalize(v)
    );

}

// ----------------------------

function store(map,e){

    const k = key(e.value);

    if(k === "null")
        return;

    if(
        !map.has(k) ||
        map.get(k).cost > e.cost
    ){

        map.set(k,e);

    }

    if(
        map.size >
        MAX_STATES_PER_INTERVAL
    ){

        const arr =
            [...map.values()]
            .sort(
                (a,b)=>
                a.cost-b.cost
            )
            .slice(
                0,
                MAX_STATES_PER_INTERVAL
            );

        map.clear();

        for(const x of arr){

            map.set(
                key(x.value),
                x
            );

        }

    }

}

// ----------------------------

function unary(expr,map){

    // factorial

    const f =
        factorial(
            expr.value
        );

    if(f !== null){

        store(
            map,
            new Expr(
                f,
                `(${expr.text})!`,
                expr.cost+1
            )
        );

    }

    // floor

    store(
        map,
        new Expr(
            Math.floor(
                expr.value
            ),
            `⌊${expr.text}⌋`,
            expr.cost+1
        )
    );

    // ceil

    store(
        map,
        new Expr(
            Math.ceil(
                expr.value
            ),
            `⌈${expr.text}⌉`,
            expr.cost+1
        )
    );
// √

if(expr.value >= 0){

    store(
        map,
        new Expr(
            Math.sqrt(expr.value),
            `√(${expr.text})`,
            expr.cost + 1
        )
    );

}

// sin

{
    const v =
        Math.sin(
            expr.value
        );

    store(
        map,
        new Expr(
            v,
            `sin(${expr.text})`,
            expr.cost + 1
        )
    );
}

// cos

{
    const v =
        Math.cos(
            expr.value
        );

    store(
        map,
        new Expr(
            v,
            `cos(${expr.text})`,
            expr.cost + 1
        )
    );
}

// tan

{
    const v =
        Math.tan(
            expr.value
        );

    if(Number.isFinite(v)){

        store(
            map,
            new Expr(
                v,
                `tan(${expr.text})`,
                expr.cost + 1
            )
        );

    }
}
// sec

{
    const c = Math.cos(expr.value);

    if(Math.abs(c) > EPS){

        store(
            map,
            new Expr(
                1 / c,
                `sec(${expr.text})`,
                expr.cost + 1
            )
        );

    }
}

// cosec (csc)

{
    const s = Math.sin(expr.value);

    if(Math.abs(s) > EPS){

        store(
            map,
            new Expr(
                1 / s,
                `cosec(${expr.text})`,
                expr.cost + 1
            )
        );

    }
}

// cotan (cot)

{
    const t = Math.tan(expr.value);

    if(Math.abs(t) > EPS){

        store(
            map,
            new Expr(
                1 / t,
                `cotan(${expr.text})`,
                expr.cost + 1
            )
        );

    }
}

store(
    map,
    new Expr(
        Math.trunc(expr.value),
        `[${expr.text}]`,
        expr.cost+1
    )
);

}

// ----------------------------

function binary(A,B,map){

    store(
        map,
        new Expr(
            A.value+B.value,
            `(${A.text}+${B.text})`,
            A.cost+B.cost+1
        )
    );

    store(
        map,
        new Expr(
            A.value-B.value,
            `(${A.text}-${B.text})`,
            A.cost+B.cost+1
        )
    );

    store(
        map,
        new Expr(
            A.value*B.value,
            `(${A.text}×${B.text})`,
            A.cost+B.cost+1
        )
    );

    if(
        Math.abs(B.value)
        > EPS
    ){

        store(
            map,
            new Expr(
                A.value/B.value,
                `(${A.text}÷${B.text})`,
                A.cost+B.cost+1
            )
        );

        store(
            map,
            new Expr(
                A.value%B.value,
                `(${A.text}%${B.text})`,
                A.cost+B.cost+1
            )
        );

    }

    // 累乗

    if(
        document
        .getElementById(
            "allowPower"
        )
        .checked
    ){

        if(
            Number.isInteger(
                B.value
            ) &&
            Math.abs(
                B.value
            ) <= 6
        ){

            const p =
                A.value **
                B.value;

            const exp =
                superscript(
                    B.value
                );

            store(
                map,
                new Expr(
                    p,
                    `${A.text}${exp}`,
                    A.cost+
                    B.cost+1
                )
            );

        }

    }
// 対数

if(
    A.value > 0 &&
    B.value > 0 &&
    Math.abs(A.value - 1) > EPS
){

    const v =
        Math.log(B.value)
        /
        Math.log(A.value);

    store(
        map,
        new Expr(
            v,
            `log${subscript(A.text)}(${B.text})`,
            A.cost + B.cost + 1
        )
    );

}
if(

    Number.isInteger(A.value)
    &&
    A.value > 1
    &&
    B.value >= 0

){

    const root =
        Math.pow(
            B.value,
            1 / A.value
        );

    store(
        map,
        new Expr(
            root,
            `${subscript(A.value)}√(${B.text})`,
            A.cost+B.cost+1
        )
    );

}

}

// ----------------------------

function solve334(
    target,
    digits
){

    const N =
        digits.length;

    const dp =
        Array.from(
            {length:N},
            ()=>Array(N)
        );

    // ------------------------
    // 単体
    // ------------------------

    for(
        let i=0;
        i<N;
        i++
    ){

        dp[i][i] =
            new Map();

        const value =
            Number(
                digits[i]
            );

        store(
            dp[i][i],
            new Expr(
                value,
                digits[i],
                0
            )
        );

    }

    // ------------------------
    // 連結
    // ------------------------

    if(
        document
        .getElementById(
            "allowConcat"
        )
        .checked
    ){

        for(
            let len=2;
            len<=N;
            len++
        ){

            for(
                let l=0;
                l+len-1<N;
                l++
            ){

                const r =
                    l+len-1;

                if(
                    !dp[l][r]
                ){

                    dp[l][r]
                        = new Map();

                }

                const txt =
                    digits
                    .slice(
                        l,
                        r+1
                    )
                    .join("");

                store(
                    dp[l][r],
                    new Expr(
                        Number(
                            txt
                        ),
                        txt,
                        0
                    )
                );

            }

        }

    }

    // ------------------------
    // 区間DP
    // ------------------------

    for(
        let len=2;
        len<=N;
        len++
    ){

        for(
            let l=0;
            l+len-1<N;
            l++
        ){

            const r =
                l+len-1;

            if(
                !dp[l][r]
            ){

                dp[l][r]
                    = new Map();

            }

            for(
                let mid=l;
                mid<r;
                mid++
            ){

                const left =
                    dp[l][mid];

                const right =
                    dp[mid+1][r];

                for(
                    const A
                    of left.values()
                ){

                    for(
                        const B
                        of right.values()
                    ){

                        binary(
                            A,
                            B,
                            dp[l][r]
                        );

                    }

                }

            }

            const snapshot =
                [
                    ...dp[l][r]
                    .values()
                ];

            for(
                const e
                of snapshot
            ){

                unary(
                    e,
                    dp[l][r]
                );

            }

        }

    }

    // ------------------------
    // 最終探索
    // ------------------------

    const root =
        dp[0][N-1];

    let answer =
        null;

    for(
        const e
        of root.values()
    ){

        if(
            Math.abs(
                e.value
                - target
            ) < EPS
        ){

            if(
    answer === null ||
    e.cost < answer.cost ||
    (
        e.cost === answer.cost &&
        e.text.length < answer.text.length
    )
){

                answer = e;

            }

        }

    }

    return answer;

}

    return null;

}

</script>
